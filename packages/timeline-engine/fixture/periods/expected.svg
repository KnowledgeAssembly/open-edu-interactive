  <text id="label-tick-6" data-oedu-role="label" data-oedu-value="1950" aria-label="1950" data-oedu-bounds="580,88,60,18" x="610" y="97" text-anchor="middle" dominant-baseline="central">1950</text>
  <text id="label-tick-7" data-oedu-role="label" data-oedu-value="1975" aria-label="1975" data-oedu-bounds="665,88,60,18" x="695" y="97" text-anchor="middle" dominant-baseline="central">1975</text>
