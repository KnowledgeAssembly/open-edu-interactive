  <text id="label-track-track-default" data-oedu-role="label" data-oedu-bounds="4,40,92,20" x="50" y="50" text-anchor="middle" dominant-baseline="central"></text>
  <rect id="track-track-default" data-oedu-role="track-lane" data-oedu-bounds="100,20,680,60" x="100" y="20" width="680" height="60" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="4,2"/>
  <rect id="period-p1" data-oedu-role="period-band" aria-label="First half (1800 – 1950)" data-oedu-bounds="100,20,510,60" x="100" y="20" width="510" height="60" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1"/>
  <rect id="period-p2" data-oedu-role="period-band" aria-label="Second half (1950 – 2000)" data-oedu-bounds="610,20,170,60" x="610" y="20" width="170" height="60" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1"/>
  <circle id="e1" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-actions="select focus" aria-label="Event A (1900)" data-oedu-bounds="418,28,44,44" cx="440" cy="50" r="22" fill="currentColor" stroke="currentColor" stroke-width="2"/>
  <circle id="e2" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-actions="select focus" aria-label="Event B (1950)" data-oedu-bounds="588,28,44,44" cx="610" cy="50" r="22" fill="currentColor" stroke="currentColor" stroke-width="2"/>
    </g>
