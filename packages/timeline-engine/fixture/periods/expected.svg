  <text id="label-tick-1" data-oedu-role="label" data-oedu-value="1825" aria-label="1825" data-oedu-bounds="155,88,60,18" x="185" y="97" text-anchor="middle" dominant-baseline="central">1825</text>
  <text id="label-tick-2" data-oedu-role="label" data-oedu-value="1850" aria-label="1850" data-oedu-bounds="240,88,60,18" x="270" y="97" text-anchor="middle" dominant-baseline="central">1850</text>
