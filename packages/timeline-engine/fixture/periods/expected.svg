  <line id="tick-0" data-oedu-role="tick" data-oedu-value="1800" data-oedu-bounds="99,80,2,6" x1="99" y1="80" x2="101" y2="86" stroke="currentColor" stroke-width="1"/>
  <line id="tick-1" data-oedu-role="tick" data-oedu-value="1825" data-oedu-bounds="184,80,2,6" x1="184" y1="80" x2="186" y2="86" stroke="currentColor" stroke-width="1"/>
  <line id="tick-2" data-oedu-role="tick" data-oedu-value="1850" data-oedu-bounds="269,80,2,6" x1="269" y1="80" x2="271" y2="86" stroke="currentColor" stroke-width="1"/>
