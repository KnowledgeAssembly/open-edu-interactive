<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Fraction bar showing three quarters</title>
  <desc>A bar divided into four equal parts with the first three highlighted.</desc>
  <g id="visual-root">
  <g id="fb" data-oedu-role="group">
    <g id="fb-bar" data-oedu-role="group" data-oedu-bounds="40,276,720,48">
      <rect id="fb-part-0" data-oedu-role="fraction-part" data-oedu-value="0" data-oedu-interactive="true" data-oedu-bounds="40,276,180,48" x="40" y="276" width="180" height="48" fill="currentColor" opacity="0.2"/>
      <rect id="fb-part-1" data-oedu-role="fraction-part" data-oedu-value="1" data-oedu-interactive="true" data-oedu-bounds="220,276,180,48" x="220" y="276" width="180" height="48" fill="currentColor" opacity="0.2"/>
      <rect id="fb-part-2" data-oedu-role="fraction-part" data-oedu-value="2" data-oedu-interactive="true" data-oedu-bounds="400,276,180,48" x="400" y="276" width="180" height="48" fill="currentColor" opacity="0.2"/>
      <rect id="fb-part-3" data-oedu-role="fraction-part" data-oedu-value="3" data-oedu-bounds="580,276,180,48" x="580" y="276" width="180" height="48" fill="currentColor" opacity="0.2"/>
    </g>
    <text id="fb-fraction-label" data-oedu-role="label" aria-label="3/4" data-oedu-bounds="40,336,200,24" x="140" y="348" text-anchor="middle" dominant-baseline="central">3/4</text>
  </g>
  </g>
</svg>
