<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Overlay map with two layers</title>
  <desc>An interactive geographic map</desc>
  <g id="map-root">
    <g id="map-layers">
  <g id="geom-risk" data-oedu-role="layer" aria-label="Risk Zones">
    <path id="geom-risk-nz" data-oedu-role="region" data-oedu-interactive="true" aria-label="North Zone" d="M 324.4 148.8 L 425.2 148.8 L 425.2 48 L 324.4 48 L 324.4 148.8 Z" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path id="geom-risk-sz" data-oedu-role="region" data-oedu-interactive="true" aria-label="South Zone" d="M 324.4 249.6 L 425.2 249.6 L 425.2 158.88 L 324.4 158.88 L 324.4 249.6 Z" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g id="geom-scale-bar" data-oedu-role="scale-bar" aria-label="2000 KM">
    <line x1="26" y1="530" x2="228" y2="530" stroke="currentColor" stroke-width="2"/>
    <line x1="26" y1="526" x2="26" y2="534" stroke="currentColor" stroke-width="1.5"/>
    <line x1="228" y1="526" x2="228" y2="534" stroke="currentColor" stroke-width="1.5"/>
  </g>
    </g>
  </g>
</svg>
